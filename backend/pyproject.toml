[project]
name = "cotrade-backend"
version = "1.0.0"
description = "Cotrade backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tools/simulatedtester/tests"]
addopts = "-q"
cache_dir = "tools/simulatedtester/.pytest_cache"

[tool.ruff]
target-version = "py311"
line-length = 200

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line length
    "E402",  # module import order
    "E741",  # ambiguous variable name
    "F401",  # imported but unused
    "F841",  # assigned but unused
]

[tool.mypy]
python_version = "py311"